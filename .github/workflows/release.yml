name: Release automatisch anlegen

# Sobald die Version in manifest.json erhöht wird, legt GitHub selbst ein
# Release an (z. B. v1.1.5). HACS zeigt dann diese Versionsnummer an.
# Erst NACHDEM „Prüfen“ (HACS, hassfest, Tests) grün durchgelaufen ist –
# so will es HACS für die Aufnahme in die offizielle Liste.
on:
  workflow_run:
    workflows: ["Prüfen"]
    types: [completed]
    branches: [main, beta]   # 🧪 „beta“ = Testversionen (Vorabversion, nur für HACS „Beta-Versionen anzeigen“)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}

      - name: Version auslesen
        id: version
        run: echo "tag=v$(jq -r .version custom_components/stundenzettel/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Download-Zahl für die Credits merken
        # 📥 Summe aller ZIP-Downloads aller Releases → www/downloads.json (im Repo steht nur der Platzhalter 0, die echte Zahl kommt in die ZIP).
        # Die Karte zeigt daraus in den Credits „rund N Downloads (Stand letztes Release)“ – ganz ohne Aufruf an GitHub.
        # Klappt die Abfrage nicht, fehlt die Datei einfach und die Zeile bleibt weg.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].assets[] | select(.name | endswith(".zip")) | .download_count' 2>/dev/null | awk '{s+=$1} END {print s+0}') || N=""
          if [ -n "$N" ]; then
            printf '{"downloads": %s, "stand": "%s"}\n' "$N" "$(date -u +%F)" > custom_components/stundenzettel/www/downloads.json
            cat custom_components/stundenzettel/www/downloads.json
          else
            echo "Download-Zahl nicht abrufbar – Platzhalter 0 bleibt, Zeile in den Credits bleibt weg."
          fi

      - name: ZIP für HACS packen
        # 📦 Fertig gepackte ZIP fürs Release: Inhalt von custom_components/stundenzettel/ OHNE Unterordner –
        # HACS entpackt sie direkt nach config/custom_components/stundenzettel/. GitHub zählt jeden Download dieser ZIP.
        run: |
          cd custom_components/stundenzettel
          find . -name "__pycache__" -prune -o -type f -print | sort | zip -X -q ../../stundenzettel.zip -@
          cd ../..
          unzip -l stundenzettel.zip | tail -n 3
          unzip -l stundenzettel.zip | grep -q " manifest.json$" || { echo "manifest.json fehlt in der ZIP"; exit 1; }

      - name: Release anlegen (nur wenn es die Version noch nicht gibt)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          # 🧪 Sicherung: Auf „beta“ nur Versionen mit -beta, auf „main“ nie eine -beta
          PRE=""
          case "$TAG" in *-beta*) PRE="--prerelease";; esac
          if [ "$BRANCH" = "beta" ] && [ -z "$PRE" ]; then echo "Auf beta nur -beta-Versionen – nichts zu tun."; exit 0; fi
          if [ "$BRANCH" != "beta" ] && [ -n "$PRE" ]; then echo "-beta gehört auf den Zweig beta – nichts zu tun."; exit 0; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 📦 Release gibt es schon: fehlt nur die ZIP, wird sie nachgereicht (z. B. per „Run workflow“)
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "stundenzettel.zip"; then
              # 📥 Alte ZIP ohne Download-Zahl (z. B. von der main-Fassung gepackt)? Dann durch die neue ersetzen.
              gh release download "$TAG" -p stundenzettel.zip -O alt.zip --clobber
              ALT=$(unzip -p alt.zip www/downloads.json 2>/dev/null | jq -r '.downloads // 0' 2>/dev/null || echo 0)
              if [ "${ALT:-0}" -gt 0 ] 2>/dev/null; then
                echo "Release $TAG gibt es schon (mit ZIP und Download-Zahl $ALT) – nichts zu tun."
              else
                gh release upload "$TAG" stundenzettel.zip --clobber
              fi
            else
              gh release upload "$TAG" stundenzettel.zip
            fi
          else
            # 📝 Kurze deutsche Beschreibung: die Commit-Texte seit dem letzten Release
            PREV=$(git describe --tags --abbrev=0 --exclude '*-beta*' "$SHA^" 2>/dev/null || true)
            RANGE=${PREV:+$PREV..}$SHA
            {
              echo "## Was ist neu"
              git log "$RANGE" --no-merges --pretty=format:'- %s'
              echo
              [ -n "$PREV" ] && echo "**Alle Änderungen:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            } > notes.md
            if ! grep -q "^- " notes.md; then
              gh release create "$TAG" --target "$SHA" --title "$TAG" $PRE --generate-notes stundenzettel.zip
            else
              gh release create "$TAG" --target "$SHA" --title "$TAG" $PRE --notes-file notes.md stundenzettel.zip
            fi
          fi
