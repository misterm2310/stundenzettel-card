kommen:
  fields:
    stundenzettel:
      selector:
        config_entry:
          integration: stundenzettel
gehen:
  fields:
    stundenzettel:
      selector:
        config_entry:
          integration: stundenzettel
tag_eintragen:
  fields:
    stundenzettel:
      selector:
        config_entry:
          integration: stundenzettel
    datum:
      required: true
      example: "2026-11-04"
      selector:
        date:
    art:
      default: work
      selector:
        select:
          translation_key: art
          options: [work, urlaub, krank, feiertag, frei, pauschal]
    von:
      example: "06:30"
      selector:
        time:
    bis:
      example: "16:15"
      selector:
        time:
    pause:
      example: 0.5
      selector:
        number:
          min: 0
          max: 12
          step: 0.25
          unit_of_measurement: h
    stunden:
      selector:
        number:
          min: 0
          max: 24
          step: 0.25
          unit_of_measurement: h
    betrag:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
    notiz:
      example: "Baustelle Musterstadt"
      selector:
        text:
abgleichen:
  fields:
    stundenzettel:
      selector:
        config_entry:
          integration: stundenzettel
daten_abrufen:
  fields:
    stundenzettel:
      selector:
        config_entry:
          integration: stundenzettel
